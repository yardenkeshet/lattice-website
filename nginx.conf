	# Site 1
# site1
server {
    listen 443 ssl;
    server_name lattice.cs.technion.ac.il;

    ssl_certificate "C:/SitesHub/prodution/lattice_p/cert.pem";
    ssl_certificate_key "C:/SitesHub/prodution/lattice_p/key_nopass.key";

    # 1. Forward Socket.io traffic to Flask
    location /socket.io {
        proxy_pass http://127.0.0.1:5003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # 2. Forward everything else to the Vite Dev Server
    location / {
        proxy_pass http://127.0.0.1:5173; # Port from your npm run dev
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }


    location ~ ^/(convert_igs_to_stl|download-results|viewlog|viewfulllog) {
    proxy_pass http://127.0.0.1:5003;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 100M;
}
}

# site2
server {
    listen 443 ssl;
    server_name cdml-public.technion.ac.il;

	client_max_body_size 50M;

    ssl_certificate "C:/SitesHub/prodution/imageTechnion_p/Cert_cdml.pem";
    ssl_certificate_key "C:/SitesHub/prodution/imageTechnion_p/private_nopass_cdml.pem";

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:8444;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for WebSockets / SocketIO
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;

        # Disable buffering for WebSocket/streaming
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
