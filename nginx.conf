    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;
	
	server_names_hash_bucket_size 64;  # increase from 32 to 64

    #gzip  on;

    server {
