# nginx/nginx.conf — Lattice website reverse proxy (Windows)
#
# Setup:
#   1. Download nginx for Windows (stable) from https://nginx.org/en/download.html
#      and extract to e.g. C:\nginx
#   2. Back up the default config, then copy this file over it:
#        copy C:\nginx\conf\nginx.conf C:\nginx\conf\nginx.conf.default
#        copy nginx\nginx.conf C:\nginx\conf\nginx.conf
#   3. Build the React frontend so dist/ is current:
#        cd react_frontend && npm run build
#   4. Start the Flask backend:  python main.py   (listens on :5003)
#   5. Start nginx:              C:\nginx\nginx.exe
#      Reload after edits:       C:\nginx\nginx.exe -s reload
#      Stop:                     C:\nginx\nginx.exe -s stop
#   6. Browse to http://localhost/  (port 80, not 5003)

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Matches SocketIO's max_http_buffer_size in main.py — allows large STL uploads
    client_max_body_size 100m;

    # Lets Socket.IO's WebSocket transport upgrade through the proxy (no-op today
    # since the backend runs in threading mode without simple-websocket, but this
    # makes WebSocket "just work" if that package is added later)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream lattice_backend {
        server 127.0.0.1:5003;
    }

    server {
        listen       80;
        server_name  localhost;

        # Production React build — rebuild with `npm run build` in react_frontend/
        root   "C:/Users/yaniv/Uni/Sem 6/Lattice Project/lattice-website/react_frontend/dist";
        index  index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /socket.io/ {
            proxy_pass http://lattice_backend/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location ~ ^/(convert_igs_to_stl|download-results|viewlog|viewfulllog|static)(/|$) {
            proxy_pass http://lattice_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 600s;
        }
    }
}
