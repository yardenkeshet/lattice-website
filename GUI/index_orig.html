<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Algorithm Visualization</title>
    
    <!-- Modern Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;500;700&display=swap" rel="stylesheet">

    <style>
        /* CSS Reset & Base Styles */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevents scroll */
            /* Deep Space Background */
            background-color: #0D1117; 
            font-family: 'Heebo', sans-serif;
            color: #ffffff;
        }

        /* Full Screen 3D Canvas */
        #canvas-container {
            width: 100%;
            height: 100%;
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* --- Futuristic UI Panel (HUD Style) --- */
        #ui-panel {
            position: absolute;
            top: 20px;
            left: 20px; /* Positioned to Left */
            right: auto; 
            width: 220px; /* Reduced width */
            padding: 15px;
            /* Dark, almost opaque background */
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            /* Thin Cyan Border */
            border: 1px solid #00FFFF;
            border-radius: 4px; /* Sharper corners */
            z-index: 10;
            /* Subtle Cyan Glow */
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5), inset 0 0 5px rgba(0, 255, 255, 0.2);
            transition: transform 0.3s ease; /* Animation for toggle */
        }
        
        /* Class for hiding the panel */
        .closed-panel {
            transform: translateX(calc(-100% - 30px)); /* Hide off-screen to the left */
        }

        /* Toggle button (Cyan Accent) */
        #toggle-ui-btn {
            position: absolute;
            top: 15px; /* Slightly raised to clear the panel edge */
            left: 240px; /* Positioned just to the right of the panel when open */
            width: 40px;
            height: 40px;
            background: #00E5FF; /* Bright Cyan */
            border: none;
            border-radius: 4px;
            color: #0D1117; /* Dark text */
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            z-index: 11; 
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            transition: all 0.3s ease, left 0.3s ease; /* Transition 'left' for opening/closing */
        }
        
        #toggle-ui-btn.closed {
             left: 20px; /* Move back to initial position when closed */
        }

        #toggle-ui-btn:hover {
            background: #00FFFF;
            box-shadow: 0 0 15px #00FFFF;
        }


        /* UI Elements Styling */
        h1 {
            font-size: 1rem;
            margin-top: 0;
            margin-bottom: 15px;
            font-weight: 700;
            letter-spacing: 2px;
            /*text-transform: uppercase;*/
            /* Cyan bottom line */
            border-bottom: 1px solid #00E5FF;
            padding-bottom: 8px;
            color: #FFFFFF;
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
        }

        .control-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            margin-bottom: 5px;
            font-weight: 300;
            color: #00E5FF; /* Cyan label */
        }

        /* Custom Select & Inputs (Monochrome with Cyan focus) */
        select, input[type="number"] {
            width: 100%;
            padding: 8px;
            background: rgba(255, 255, 255, 0.03); /* Very dark input field */
            border: 1px solid #333;
            border-radius: 2px; /* Very sharp corners */
            color: #fff;
            font-family: 'Heebo', sans-serif;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s;
            box-sizing: border-box;
        }
        
        /* Layout for multi-input rows */
        .input-row {
            display: flex;
            gap: 5px;
        }
        
        .input-row input {
            min-width: 0; 
        }

        select:focus, input[type="number"]:focus {
            border-color: #00FFFF;
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.8);
        }

        select option {
            background: #0D1117;
        }
        
        /* Download Button Styling (Pure Cyan) */
        #download-btn {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background: #00E5FF;
            border: 1px solid #00FFFF;
            border-radius: 4px;
            color: #0D1117; /* Dark text */
            font-weight: 700;
            cursor: pointer;
            font-family: 'Heebo', sans-serif;
            transition: all 0.2s;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        #download-btn:hover {
            background: #00FFFF;
            box-shadow: 0 0 15px #00FFFF;
        }

        #download-btn:active {
            transform: scale(0.98);
        }

        /* Responsive styling */
        @media (max-width: 600px) {
            #ui-panel {
                width: calc(100% - 40px);
                top: auto;
                bottom: 20px;
                left: 20px; 
                right: 20px;
                transform: none !important; 
            }
            
            #toggle-ui-btn {
                top: 20px;
                right: 20px;
                left: auto;
            }
        }
    </style>

    <!-- Load Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- STL Exporter for 3D model saving -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/exporters/STLExporter.js"></script> 
</head>
<body>

    <!-- Toggle Button (Use '«' for close and '☰' for open) -->
    <button id="toggle-ui-btn">«</button>

    <!-- UI Panel -->
    <div id="ui-panel">
        <h1>Lattice</h1>
        
        <div class="control-group">
            <label for="tileType">Tile Type</label>
            <select id="tileType">
                <option value="diagonal">DIAGONAL</option>
                <option value="cross">CROSS</option>
                <option value="cross_diagonal">CROSS_DIAGONAL</option>
            </select>
        </div>

        <div class="control-group">
            <label>Num Tiles (X, Z, Scale)</label>
            <div class="input-row">
                <input type="number" id="nt1" value="20" title="Count X">
                <input type="number" id="nt2" value="20" title="Count Z">
                <input type="number" id="nt3" value="1.0" step="0.1" title="Scale/Spacing">
            </div>
        </div>

        <div class="control-group">
            <label>Graded (Amp, Freq)</label>
            <div class="input-row">
                <input type="number" id="g1" value="2.0" step="0.1" title="Amplitude">
                <input type="number" id="g2" value="0.2" step="0.05" title="Frequency">
            </div>
        </div>

        <!-- DOWNLOAD Button - Updated to reflect STL export -->
        <button id="download-btn">Export STL</button>
    </div>

    <!-- 3D Container -->
    <div id="canvas-container"></div>

    <script>
        // --- 1. Setup Three.js Scene ---
        const scene = new THREE.Scene();
        // Fog for depth feeling
        scene.fog = new THREE.FogExp2(0x050505, 0.02);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;

        // Lighting (Updated to Cyan/Blue theme)
        const ambientLight = new THREE.AmbientLight(0x404040, 2); // Soft white light
        scene.add(ambientLight);

        // Primary Cyan Light
        const pointLight1 = new THREE.PointLight(0x00E5FF, 3, 50); 
        pointLight1.position.set(10, 20, 10);
        scene.add(pointLight1);

        // Secondary Deep Blue Light
        const pointLight2 = new THREE.PointLight(0x008CFF, 1.5, 50); 
        pointLight2.position.set(-10, -10, -10);
        scene.add(pointLight2);

        // Group to hold the grid
        let gridGroup = new THREE.Group();
        scene.add(gridGroup);

        // --- 2. Algorithm Logic ---

        // Helper materials (Updated to Cyan/Blue theme)
        const materialCore = new THREE.MeshPhysicalMaterial({ 
            color: 0x00E5FF, /* Bright Cyan */
            metalness: 0.2, 
            roughness: 0.1,
            transparent: true,
            opacity: 0.8,
            side: THREE.DoubleSide
        });
        
        const materialSecondary = new THREE.MeshStandardMaterial({ 
            color: 0x112233, /* Deep Dark Blue */
            metalness: 0.8, 
            roughness: 0.2 
        });

        // Helper function to recursively clean up object geometries (fixes the disposal error)
        function disposeRecursive(obj) {
            // Dispose geometry if it exists (only meshes have geometry)
            if (obj.geometry) {
                obj.geometry.dispose();
            }
            // Recursively dispose children
            // Important: We need to make a copy of the children array 
            // because removing an item changes the array length.
            const children = [...obj.children];
            for (const child of children) {
                disposeRecursive(child);
                obj.remove(child); // Remove the child from its parent after disposal
            }
        }

        function clearGrid() {
            // Dispose geometries before removing the objects from the group
            while(gridGroup.children.length > 0){ 
                const obj = gridGroup.children[0];
                disposeRecursive(obj); // Dispose of the object and its children recursively
                // The disposeRecursive now also removes children from the group, 
                // but we still need to remove the top-level object from gridGroup.
                gridGroup.remove(obj); 
            }
        }

        function generateGrid() {
            clearGrid();

            // Get parameters from UI
            const tileType = document.getElementById('tileType').value;
            
            // New logic: Read directly from input fields
            // Num Tiles (3 Floats)
            let nt1 = parseFloat(document.getElementById('nt1').value) || 20; // Grid X
            let nt2 = parseFloat(document.getElementById('nt2').value) || 20; // Grid Z
            let nt3 = parseFloat(document.getElementById('nt3').value) || 1.0; // Scale/Spacing

            // Graded (2 Floats)
            let g1 = parseFloat(document.getElementById('g1').value) || 2.0; // Amplitude
            let g2 = parseFloat(document.getElementById('g2').value) || 0.2; // Frequency

            // Limits to prevent crashes
            nt1 = Math.min(Math.max(nt1, 1), 100);
            nt2 = Math.min(Math.max(nt2, 1), 100);
            
            const tileSize = 1 * nt3; // Use 3rd parameter for size/scale
            const offsetX = (nt1 * tileSize) / 2;
            const offsetZ = (nt2 * tileSize) / 2;

            // Adjust camera position based on grid size
            const maxDim = Math.max(nt1, nt2) * tileSize;
            camera.position.set(maxDim, maxDim * 0.8, maxDim);
            controls.target.set(0,0,0);

            for (let x = 0; x < nt1; x++) {
                for (let z = 0; z < nt2; z++) {
                    
                    // Logic for Graded: 
                    // g1 = Amplitude (Height factor)
                    // g2 = Frequency (Wave density)
                    
                    let heightFactor = 0.2;
                    let posY = 0;

                    // Create a wave pattern
                    const dist = Math.sqrt((x - nt1/2)**2 + (z - nt2/2)**2);
                    heightFactor = 1 + Math.sin(dist * g2) * g1; 
                    posY = Math.sin((x+z) * g2) * g1;

                    // Ensure minimum height
                    if (heightFactor < 0.1) heightFactor = 0.1;

                    const posX = (x * tileSize) - offsetX + (tileSize/2);
                    const posZ = (z * tileSize) - offsetZ + (tileSize/2);
                    
                    createTile(tileType, posX, posY, posZ, tileSize, heightFactor);
                }
            }
        }

        function createTile(type, x, y, z, size, heightScale) {
            let geometry;
            let mesh;
            
            // Base thickness
            const thickness = 0.1 * size;
            const height = thickness * (heightScale > 0 ? heightScale : 1);

            if (type === 'diagonal') {
                // A box rotated 45 degrees
                geometry = new THREE.BoxGeometry(size * 0.8, height, size * 0.15);
                mesh = new THREE.Mesh(geometry, materialCore);
                mesh.rotation.y = Math.PI / 4;
            } 
            else if (type === 'cross') {
                // A plus sign
                const group = new THREE.Group();
                
                const geo1 = new THREE.BoxGeometry(size, height, size * 0.2);
                const m1 = new THREE.Mesh(geo1, materialCore);
                
                const geo2 = new THREE.BoxGeometry(size * 0.2, height, size);
                const m2 = new THREE.Mesh(geo2, materialCore);

                group.add(m1);
                group.add(m2);
                
                group.position.set(x, y, z);
                gridGroup.add(group);
                return; // Early return because we added a group
            } 
            else if (type === 'cross_diagonal') {
                // An X sign
                const group = new THREE.Group();
                
                const geo1 = new THREE.BoxGeometry(size * 1.2, height, size * 0.15);
                const m1 = new THREE.Mesh(geo1, materialCore);
                m1.rotation.y = Math.PI / 4;
                
                const geo2 = new THREE.BoxGeometry(size * 1.2, height, size * 0.15);
                const m2 = new THREE.Mesh(geo2, materialCore);
                m2.rotation.y = -Math.PI / 4;

                group.add(m1);
                group.add(m2);

                group.position.set(x, y, z);
                gridGroup.add(group);
                return;
            }

            // Fallback for single mesh types
            if (mesh) {
                mesh.position.set(x, y, z);
                gridGroup.add(mesh);
            }
        }
        
        // --- STL Export Helper Functions (used by the download button) ---
        // Creates a temporary link element to trigger the download.
        const link = document.createElement( 'a' );
        link.style.display = 'none';
        document.body.appendChild( link ); 

        function save( blob, filename ) {
            link.href = URL.createObjectURL( blob );
            link.download = filename;
            link.click();
        }

        // Saves ArrayBuffer data (like binary STL)
        function saveArrayBuffer( buffer, filename ) {
            save( new Blob( [ buffer ], { type: 'application/octet-stream' } ), filename );
        }
        // --- End of STL Export Helpers ---


        // --- 3. Events & Initialization ---

        // Listeners for parameter changes
        document.getElementById('tileType').addEventListener('change', generateGrid);
        
        // Add listeners to all inputs
        ['nt1', 'nt2', 'nt3', 'g1', 'g2'].forEach(id => {
            document.getElementById(id).addEventListener('change', generateGrid);
            document.getElementById(id).addEventListener('input', generateGrid); // Updates while typing/sliding
        });

        // Download Button Handler (Now includes STL export)
        document.getElementById('download-btn').addEventListener('click', () => {
            const settings = {
                tileType: document.getElementById('tileType').value,
                numTiles: {
                    x_count: parseFloat(document.getElementById('nt1').value),
                    z_count: parseFloat(document.getElementById('nt2').value),
                    scale: parseFloat(document.getElementById('nt3').value)
                },
                graded: {
                    amplitude: parseFloat(document.getElementById('g1').value),
                    frequency: parseFloat(document.getElementById('g2').value)
                }
            };

            // 1. Log Settings (as before)
            console.log("--- DOWNLOADED SETTINGS ---");
            console.log(JSON.stringify(settings, null, 2));
            console.log("---------------------------");
            
            // 2. Export STL Model
            const btn = document.getElementById('download-btn');
            const originalText = btn.textContent;
            
            try {
                // STLExporter is available globally due to the CDN script tag
                const exporter = new THREE.STLExporter();
                
                // Export the entire group containing all tiles as binary STL
                const result = exporter.parse( gridGroup, { binary: true } ); 
                const filename = `3d_algo_grid_${Date.now()}.stl`;
                saveArrayBuffer( result, filename );
                
                console.log(`STL model '${filename}' exported successfully.`);
                
                // Visually confirm export action
                btn.textContent = 'Exported !';
                btn.style.backgroundColor = '#4CAF50'; // Green success color
                setTimeout(() => { 
                    btn.textContent = originalText; 
                    btn.style.backgroundColor = ''; // Reset color
                }, 1500);

            } catch(e) {
                console.error("Error during STL export:", e);
                
                // Visually show error
                btn.textContent = 'EXPORT FAILED!';
                btn.style.backgroundColor = '#F44336'; // Red error color
                setTimeout(() => { 
                    btn.textContent = originalText; 
                    btn.style.backgroundColor = ''; // Reset color
                }, 2000);
            }
        });

        // Toggle UI Panel Logic
        const uiPanel = document.getElementById('ui-panel');
        const toggleBtn = document.getElementById('toggle-ui-btn');
        let isPanelOpen = true;

        function toggleUIPanel() {
            isPanelOpen = !isPanelOpen;
            if (isPanelOpen) {
                uiPanel.classList.remove('closed-panel');
                toggleBtn.classList.remove('closed');
                toggleBtn.textContent = '«'; // Close icon (Double Left Arrow)
            } else {
                uiPanel.classList.add('closed-panel');
                toggleBtn.classList.add('closed');
                toggleBtn.textContent = '☰'; // Open icon (Hamburger Menu)
            }
        }

        // Initialize toggle button functionality
        toggleBtn.addEventListener('click', toggleUIPanel);


        // Resize Handling
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            
            // Optional: Subtle floating effect for the whole grid
            const time = Date.now() * 0.001;
            gridGroup.position.y = Math.sin(time) * 0.5;

            renderer.render(scene, camera);
        }

        // Init
        generateGrid();
        animate();

    </script>
</body>
</html>
