<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>STL Viewer - Three.js + Flask-SocketIO</title>
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; font-family: sans-serif; }
    #viewer { width: 100%; height: 100%; display: block; }
    #ui {
      position: absolute;
      left: 10px;
      top: 10px;
      z-index: 10;
      background: rgba(255,255,255,0.9);
      padding: 10px;
      border-radius: 8px;
      max-width: 320px;
      font-size: 13px;
    }
    #perfBox {
      position: absolute;
      right: 10px;
      top: 10px;
      z-index: 10;
      background: rgba(0,0,0,0.4);
      padding: 12px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 12px;
      color: green;
    }
    #dropzone {
      border: 2px dashed #aaa;
      padding: 8px;
      text-align: center;
      margin-bottom: 8px;
    }
    /* Style to initially hide the download area */
    #download-area {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid #ddd;
        display: none; /* Crucial: hide until calculation is done */
    }
  </style>
</head>
<body>
  <div id="ui">
    <div id="dropzone">Drag & Drop STL here or <input id="fileInput" type="file" accept=".stl"></div>

    <label>Distance (target vertices): <span id="distanceVal">300</span></label><br>
    <input id="distance" type="range" min="3" max="3000" value="300" step="1" />

    <div>
      <label><input id="toggle1" type="checkbox" /> toggle (string)</label>
    </div>

    <div>
      <label><input name="radio" type="radio" value="A" checked /> A</label>
      <label><input name="radio" type="radio" value="B" /> B</label>
    </div>

    <button id="calculate">Calculate & Send</button>
    <div style="margin-top:8px;">
      <strong>Status:</strong> <span id="status">idle</span>
    </div>

    <div id="download-area">
      <p>Your latest results are ready for download.</p>

      <form id="download-form" action="{{ url_for('download_results') }}" method="POST">
        <input type="hidden" name="token" id="download-token-input">

        <button type="submit" class="export-button">
            ⬇️ Download Zipped Results
        </button>
      </form>
      </div>
    </div>
    </div>

  <div id="perfBox">
    <div>Client→Server: <span id="t_client_server">-</span> ms</div>
    <div>Server process: <span id="t_process">-</span> ms</div>
    <div>Compress: <span id="t_compress">-</span> ms</div>
    <div>Send back: <span id="t_send">-</span> ms</div>
    <div>Overall: <span id="t_overall">-</span> ms</div>
  </div>

  <canvas id="viewer"></canvas>

  <script src="/static/pako.min.js"></script>

  <script type="module" src="/static/client.js"></script>
</body>
</html>
